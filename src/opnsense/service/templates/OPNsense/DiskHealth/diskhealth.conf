# autogenerated by the Disk Health plugin, do not edit
{% if helpers.exists('OPNsense.DiskHealth') %}
[general]
unit = {{ OPNsense.DiskHealth.temp_unit|default('C') }}
warning_temp = {{ OPNsense.DiskHealth.warning_temp|default('60') }}
critical_temp = {{ OPNsense.DiskHealth.critical_temp|default('80') }}
temp_alerts = {{ OPNsense.DiskHealth.temp_alerts|default('1') }}
{% if helpers.exists('OPNsense.DiskHealth.disks.disk') %}
{%   for disk in helpers.toList('OPNsense.DiskHealth.disks.disk') %}

[{{ disk.device }}]
enabled = {{ disk.enabled|default('1') }}
warning_temp = {{ disk.warning_temp|default('') }}
critical_temp = {{ disk.critical_temp|default('') }}
{%   endfor %}
{% endif %}
{% endif %}
